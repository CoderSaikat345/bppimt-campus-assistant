[project]
name = "bppimt-campus-assistant-backend"
version = "1.0.0"
description = "Enterprise RAG-based chatbot API for BPPIMT"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "google-auth>=2.30.0",
    "google-cloud-aiplatform>=1.57.0",
    "google-cloud-bigquery>=3.24.0",
    "llama-index>=0.14.0",
    "llama-index-core>=0.14.0",
    "llama-index-llms-google-genai>=0.9.0",
    "llama-index-embeddings-vertex>=0.5.0",
    "llama-index-vector-stores-bigquery>=0.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    # ── Ingestion pipeline ────────────────────────────────────────────────────
    "pdfplumber>=0.11.0",        # PDF table extraction with geometry detection
    "openpyxl>=3.1.4",           # Excel (.xlsx) with merged-cell support
    "vertexai>=1.57.0",          # Vertex AI SDK (text-embedding-004)
    "icalendar>=6.0.0",          # RFC 5545 .ics calendar generation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dependencies*", "ingestion*", "routers*", "services*"]

